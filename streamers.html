  <style>
    .streamers-live-summary{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
    .streamers-live-summary>div{display:grid;min-width:118px;padding:10px 14px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.025)}
    .streamers-live-summary strong{font-size:22px;line-height:1;color:#fff}.streamers-live-summary span{margin-top:4px;color:#8fa2b4;font-size:10px;font-weight:800;letter-spacing:.08em}
    .streamer-poster-card.status-soon .streamer-poster-status{color:#ffd45d}.streamer-poster-card.status-scheduled .streamer-poster-status{color:#62ebff}.streamer-poster-card.status-offline .streamer-poster-status{color:#8fa2b4}
  </style>
</head>
<body data-cloud-streamers="1">
  <section id="siteContent" class="site-content streamers-page">
    <header class="site-header"></header>

    <main class="streamers-showcase-page tl-page-hero-shell-v102">
      <section class="tl-page-hero-v102">
        <div class="streamers-live-toolbar">
          <span class="streamers-live-now"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><strong id="streamersLiveCount">0</strong><b>AO VIVO</b></span>
          <button id="streamersNextLive" class="streamers-next-live" type="button" aria-label="Mostrar próxima live"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 5 8 7-8 7"/><path d="M17 5v14"/></svg><span>PRÓXIMA LIVE</span></button>
        </div>
        <p class="streamers-live-copy">Veja quem está ao vivo agora e os próximos horários da equipa.</p>
        <div class="streamers-mini-summary"><span><b id="streamersSoonCount">0</b> EM BREVE</span><span><b id="streamersCount">0</b> STREAMERS</span></div>
      </section>

      <section class="streamers-showcase-list">
        <div id="streamersPublicGrid" class="streamer-unified-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> Team Lambreta — Juntos somos mais fortes.</p>
    </footer>
  </section>

  <script src="tl-diagnostics-v104.js?v=104.0"></script>

  <script src="community-progress-v938.js?v=104.0"></script>
</body>
</html>
