<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 250" role="img" aria-labelledby="title desc">
  <title id="title">Team Lambreta</title>
  <desc id="desc">Cabeçalho da equipa com linhas verde e vermelha, marca Team Lambreta e instrução para abrir os perfis.</desc>
  <defs>
    <linearGradient id="leftLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d5b18" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#9b7625" stop-opacity=".6"/>
      <stop offset="0.88" stop-color="#73ff18" stop-opacity=".95"/>
      <stop offset="1" stop-color="#d9a441" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="rightLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a441" stop-opacity=".78"/>
      <stop offset="0.14" stop-color="#d92a1c" stop-opacity=".95"/>
      <stop offset="0.42" stop-color="#9b7625" stop-opacity=".6"/>
      <stop offset="1" stop-color="#7d5b18" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe8a0"/>
      <stop offset=".48" stop-color="#e8b94f"/>
      <stop offset="1" stop-color="#a96e16"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="250" fill="transparent"/>
  <rect x="30" y="34" width="650" height="2" rx="1" fill="url(#leftLine)"/>
  <rect x="920" y="34" width="650" height="2" rx="1" fill="url(#rightLine)"/>

  <g transform="translate(704 12)" fill="url(#gold)" filter="url(#softGlow)">
    <path d="M0 15h34l-8 11H12zM9 29h28l-7 10H17z"/>
    <path d="M39 15h34L61 26H33zM35 29h28L50 39H28z"/>
  </g>
  <text x="800" y="39" text-anchor="middle" fill="url(#gold)" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="900" letter-spacing="2.8">TEAM LAMBRETA</text>

  <text x="800" y="118" text-anchor="middle" fill="url(#gold)" font-family="Inter,Arial,sans-serif" font-size="70" font-weight="900" letter-spacing="2">TEAM LAMBRETA</text>

  <rect x="565" y="144" width="188" height="2" rx="1" fill="url(#leftLine)"/>
  <g transform="translate(780 130) scale(.55)" fill="url(#gold)">
    <path d="M0 15h34l-8 11H12zM9 29h28l-7 10H17z"/>
    <path d="M39 15h34L61 26H33zM35 29h28L50 39H28z"/>
  </g>
  <rect x="847" y="144" width="188" height="2" rx="1" fill="url(#rightLine)"/>

  <text x="800" y="204" text-anchor="middle" fill="#d8b66d" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="500">Clica num membro para abrir o perfil completo.</text>
</svg>
