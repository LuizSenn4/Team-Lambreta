  <g fill="none" stroke="url(#goldEdge)" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M54 48h185"/>
    <path d="M521 48h185"/>
  </g>
  <text x="380" y="64" text-anchor="middle" fill="#f7e5a3" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" letter-spacing="18">TEAM</text>
  <g filter="url(#depth)">
    <text x="380" y="168" text-anchor="middle" fill="#3b1c00" stroke="#1a0c00" stroke-width="11" paint-order="stroke fill" font-family="Georgia, 'Times New Roman', serif" font-size="116" font-style="italic" font-weight="900" letter-spacing="-4">Lambreta</text>
    <text x="380" y="160" text-anchor="middle" fill="url(#goldMain)" stroke="#f4bd39" stroke-width="2.2" paint-order="stroke fill" font-family="Georgia, 'Times New Roman', serif" font-size="116" font-style="italic" font-weight="900" letter-spacing="-4">Lambreta</text>
