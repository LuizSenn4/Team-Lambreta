<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="tlLogoTitle tlLogoDesc">
  <title id="tlLogoTitle">Team Lambreta</title>
  <desc id="tlLogoDesc">Team Lambreta — União, Disciplina, Respeito</desc>
  <defs>
    <linearGradient id="goldMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5ba"/>
      <stop offset=".13" stop-color="#ffe37a"/>
      <stop offset=".34" stop-color="#ffc52b"/>
      <stop offset=".58" stop-color="#d88908"/>
      <stop offset=".78" stop-color="#8b4600"/>
      <stop offset="1" stop-color="#3f1c00"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6bd"/>
      <stop offset=".42" stop-color="#ffc62c"/>
      <stop offset="1" stop-color="#6d3300"/>
    </linearGradient>
    <filter id="depth" x="-25%" y="-35%" width="150%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="blur"/>
      <feOffset in="blur" dx="0" dy="7" result="shadow"/>
      <feColorMatrix in="shadow" type="matrix" values="0 0 0 0 0.10 0 0 0 0 0.045 0 0 0 0 0 0 0 0 .95 0" result="darkShadow"/>
      <feMerge><feMergeNode in="darkShadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="url(#goldStroke)" stroke-linecap="round">
    <path d="M78 55H315" stroke-width="4"/>
    <path d="M585 55H822" stroke-width="4"/>
    <path d="M84 245H262" stroke-width="3"/>
    <path d="M638 245H816" stroke-width="3"/>
  </g>

  <text x="450" y="75" text-anchor="middle" fill="#f7dda0" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="700" letter-spacing="24">TEAM</text>

  <g filter="url(#depth)">
    <text x="450" y="208" text-anchor="middle" fill="#341500" stroke="#160900" stroke-width="15" paint-order="stroke fill" font-family="'Old English Text MT','UnifrakturCook','UnifrakturMaguntia','Lucida Blackletter',Georgia,serif" font-size="170" font-weight="900" letter-spacing="-7">Lambreta</text>
    <text x="450" y="198" text-anchor="middle" fill="url(#goldMain)" stroke="url(#goldStroke)" stroke-width="3" paint-order="stroke fill" font-family="'Old English Text MT','UnifrakturCook','UnifrakturMaguntia','Lucida Blackletter',Georgia,serif" font-size="170" font-weight="900" letter-spacing="-7">Lambreta</text>
  </g>

  <g fill="#f4eee4" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" letter-spacing="6">
    <text x="450" y="266" text-anchor="middle">UNIÃO  •  DISCIPLINA  •  RESPEITO</text>
  </g>
</svg>
