<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="tlLogoTitle tlLogoDesc">
  <title id="tlLogoTitle">Team Lambreta</title>
  <desc id="tlLogoDesc">Team Lambreta — União, Disciplina, Respeito</desc>
  <defs>
    <linearGradient id="goldMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4b5"/>
      <stop offset="0.20" stop-color="#ffd653"/>
      <stop offset="0.52" stop-color="#e79b16"/>
      <stop offset="0.78" stop-color="#b96607"/>
      <stop offset="1" stop-color="#6f3500"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a2"/>
      <stop offset="0.45" stop-color="#e7a52b"/>
      <stop offset="1" stop-color="#7f4105"/>
    </linearGradient>
    <filter id="depth" x="-20%" y="-30%" width="140%" height="180%">
