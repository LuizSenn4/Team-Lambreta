<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#090c12">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistir Live - Team Lambreta</title>
  <link rel="stylesheet" href="style-v92.css" />
  <link rel="stylesheet" href="ui-core-v93.css?v=93.0" />
  <link rel="stylesheet" href="tl-design-system-v100.css?v=102.0" />
  <link rel="stylesheet" href="tl-shell-v104.css?v=104.0" />
  <link rel="stylesheet" href="tl-polish-v100.css?v=100.0" />
</head>
<body class="live-watch-body">
  <section id="siteContent" class="site-content live-watch-site">
    <header class="site-header"></header>

    <main class="live-watch-shell">
      <section class="live-watch-main">
        <div class="live-watch-heading">
          <div class="live-watch-heading-copy">
            <p class="live-watch-kicker"><span class="live-dot"></span> TRANSMISSÃO</p>
            <div class="live-watch-title-line">
              <h1 id="liveWatchTitle">INK31 ao vivo</h1>
              <div class="live-meta-inline" aria-label="Informações da transmissão">
                <div class="live-meta-control-wrap live-meta-game-wrap">
                  <button id="liveGameSelectorBtn" class="live-meta-pill live-meta-pill--game" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <small>JOGO</small><span class="live-meta-divider" aria-hidden="true"></span><b id="liveGameBadge">Fortnite</b><span class="live-meta-chevron" aria-hidden="true">⌄</span>
                  </button>
                  <div id="liveGameMenu" class="live-meta-menu live-meta-menu--game" role="listbox" hidden></div>
                </div>
                <span class="live-meta-sep" aria-hidden="true">•</span>
                <div class="live-meta-control-wrap live-meta-mode-wrap">
                  <button id="liveModeSelectorBtn" class="live-meta-pill live-meta-pill--mode" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <small>MODO</small><span class="live-meta-divider" aria-hidden="true"></span><b id="liveModeBadge">Battle Royale</b><span class="live-meta-chevron" aria-hidden="true">⌄</span>
                  </button>
                  <div id="liveModeMenu" class="live-meta-menu live-meta-menu--mode" role="listbox" hidden></div>
                </div>
                <span class="live-meta-sep" aria-hidden="true">•</span>
                <div class="live-meta-control-wrap live-meta-variant-wrap">
                  <button id="liveVariantSelectorBtn" class="live-meta-pill live-meta-pill--variant" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <small>TIPO</small><span class="live-meta-divider" aria-hidden="true"></span><b id="liveVariantBadge">Zero Build</b><span class="live-meta-chevron" aria-hidden="true">⌄</span>
                  </button>
                  <div id="liveVariantMenu" class="live-meta-menu live-meta-menu--variant" role="listbox" hidden></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="live-watch-player-card" id="livePlayerCard">
          <iframe id="tiktokLivePlayer" class="live-watch-player" allow="autoplay; fullscreen" allowfullscreen loading="eager" title="TikTok LIVE"></iframe>
          <div id="livePlayerFallback" class="live-watch-fallback">
            <img src="img/streamers/ink31-profile.jpg" alt="INK31">
            <div><span>TEAM LAMBRETA LIVE</span><strong id="liveFallbackTitle">A preparar a transmissão…</strong><p id="liveFallbackText">O player vai aparecer aqui assim que o TikTok autorizar a reprodução.</p></div>
          </div>
        </div>
      </section>


      <aside class="online-chat live-watch-chat">
        <div class="chat-head">
          <div><p>CHAT ONLINE</p><h2>Chat da live</h2></div>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <button id="chatMentionBadge" class="tl-mention-badge" type="button" hidden aria-label="Ver menções"></button>
        <form id="chatForm" class="chat-form tl-chat-compose">
          <div class="tl-chat-compose-box"><textarea id="chatInput" maxlength="240" rows="1" placeholder="Escreve no chat da live..." autocomplete="off"></textarea><button class="tl-chat-send tl-chat-send-svg" type="submit" aria-label="Enviar mensagem" title="Enviar"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 6.8 43 24 5 41.2l5.6-14.1L30.5 24l-19.9-3.1L5 6.8Z"/></svg></button><div id="chatMentionSuggestions" class="tl-mention-suggestions" hidden></div></div>
          <label class="tl-enter-toggle"><input id="enterBreakToggle" type="checkbox"><span class="tl-toggle-track" aria-hidden="true"><i></i></span><span>Enter quebra linha</span></label>
        </form>
        <p id="chatDelayInfo" class="chat-delay-info"></p><p id="chatModerationInfo" class="chat-moderation-info"></p>
        <div id="moderationPanel" class="moderation-panel"><strong id="moderationTarget">Usuário</strong><button type="button" data-mod-action="block-1">Bloquear 1 min</button><button type="button" data-mod-action="block-5">Bloquear 5 min</button><button type="button" data-mod-action="block-15">Bloquear 15 min</button><button type="button" data-mod-action="unblock">Remover silêncio</button><button type="button" data-mod-action="ban">Bloquear permanentemente</button><button type="button" data-mod-action="unban">Remover bloqueio permanente</button><div class="role-assign-box"><span>Atribuir cargo</span><button type="button" data-role-set="admin">Admin</button><button type="button" data-role-set="staff">Staff</button><button type="button" data-role-set="vip">VIP</button><button type="button" data-role-set="supporter">Apoiador</button><button type="button" data-role-set="moderator">Moderador</button><button type="button" data-badge-set="streamer" data-enabled="true">Dar STREAMER</button><button type="button" data-badge-set="streamer" data-enabled="false">Remover STREAMER</button><button type="button" data-role-set="user">Usuário</button></div><button type="button" data-mod-action="close">Fechar</button></div>
      </aside>
    </main>

    <footer class="site-footer"><p>© <span id="year"></span> Team Lambreta — Juntos somos mais fortes.</p></footer>
  </section>

  <script>window.TEAM_SUPABASE_MODE = true;</script>
  <script src="tl-diagnostics-v104.js?v=104.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
  <script src="supabase-client.js?v=104.0"></script>
  <script src="auth-manager.js?v=104.0"></script><script src="presence-manager.js?v=103.0"></script><script src="services/profile-service.js?v=102.5"></script><script src="services/permission-service.js?v=102.0"></script>
  <script src="community-safety-v9347.js?v=93.4.7"></script>
  <script>
    (() => {
      const rawUser = (new URLSearchParams(location.search).get('user') || 'live').replace(/^@/, '').trim().toLowerCase();
      const safeUser = rawUser.replace(/[^a-z0-9._-]/g, '').slice(0, 32) || 'live';

      async function bootLiveChatRoom() {
        let room = `live:${safeUser}`;
        let sessionClient = null;
        try {
          sessionClient = window.teamSupabase;
          if (sessionClient) {
            const { data, error } = await sessionClient.rpc('tl_claim_live_chat_session', { p_streamer: safeUser });
            if (!error && typeof data === 'string' && data.trim()) room = data.trim().toLowerCase();
            else if (error) console.warn('[Team Lambreta] Sessão da live em fallback:', error.message);
          }
        } catch (error) {
          console.warn('[Team Lambreta] Não foi possível resolver a sessão da live:', error);
        }

        window.TL_LIVE_STREAMER = safeUser;
        window.TL_CHAT_ROOM = room;
        window.TL_LIVE_CHAT_ROOM = room;
        document.body.dataset.chatRoom = room;

        window.TeamLiveChatSession = {
          room,
          streamer: safeUser,
          async touch() {
            if (!sessionClient || !room.includes(':')) return;
            try { await sessionClient.rpc('tl_touch_live_chat_session', { p_room: room }); } catch (_) {}
          },
          async close() {
            if (!sessionClient || !room.includes(':')) return;
            try { await sessionClient.rpc('tl_close_live_chat_session', { p_room: room }); } catch (_) {}
          }
        };

        const script = document.createElement('script');
        script.src = 'supabase-integration-v92.js?v=93.7.1';
        script.defer = true;
        document.body.appendChild(script);
      }

      bootLiveChatRoom();
    })();
  </script>
  <script src="tl-shell-v102.js?v=104.0"></script>
  <script src="error-codes-v92.js"></script>
  <script src="chat-translate-v92.js"></script>
  <script src="community-progress-v938.js?v=93.8.6"></script>
  <script src="live-page-v9366.js?v=93.8.8"></script>
</body>
</html>
