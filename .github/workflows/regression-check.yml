name: Regression check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check tl-shell-v115.js
          node --check auth-manager.js
          node --check profile-v120.js
          node --check profile-edit-v117.js
          node --check profile-social-editor-v117.js
          node --check profile-game-v123.js
          node --check forum-board-v2.js
          node --check services/profile-service.js
      - name: Regression guard
        run: node scripts/regression-check.mjs
