<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090c12">
  <title>Atualizações — Team Lambreta</title>
  <meta name="description" content="Novidades, melhorias e correções do Team Lambreta.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="style-v92.css?v=92.39.4.4">
  <link rel="stylesheet" href="ui-core-v93.css?v=93.0">
  <link rel="stylesheet" href="updates-v1.css?v=1.0">
  <link rel="stylesheet" href="tl-design-system-v100.css?v=102.0">
  <link rel="stylesheet" href="tl-polish-v100.css?v=100.0">
  <link rel="stylesheet" href="tl-shell-v115.css?v=115.0">
</head>
<body>
  <section class="site-content updates-page">
    <header class="site-header"></header>
    <main class="updates-shell">
      <section class="updates-hero">
        <p>ATUALIZAÇÕES</p>
        <h1>Novidades</h1>
        <span>Tudo que está mudando no Team Lambreta.</span>
      </section>
      <section id="updatesNotice" class="updates-notice" hidden>
        <div><strong>NOVA ATUALIZAÇÃO DISPONÍVEL</strong><small id="updatesNoticeText"></small></div>
        <button id="updatesNoticeOpen" type="button">Ver novidades</button>
      </section>
      <section id="updatesList" class="updates-list" aria-live="polite"><p class="updates-empty">A carregar atualizações...</p></section>
      <section id="updatesAdmin" class="updates-admin" hidden>
        <h2>Gerir atualizações</h2>
        <form id="updatesForm">
          <input id="updatesId" type="hidden">
          <label>Versão<input id="updatesVersion" required placeholder="2026.08.16"></label>
          <label>Data<input id="updatesDate" type="date" required></label>
          <label class="full">Título<input id="updatesTitle" required></label>
          <label class="full">Resumo<input id="updatesSummary" required></label>
          <label class="full">Conteúdo<textarea id="updatesContent"></textarea></label>
          <label>Tipo<select id="updatesCategory"><option>NOVO</option><option>MELHORIA</option><option>CORREÇÃO</option><option>SEGURANÇA</option><option>VISUAL</option><option>COMUNIDADE</option></select></label>
          <label>Estado<select id="updatesPublished"><option value="false">Rascunho</option><option value="true">Publicado</option></select></label>
          <div class="updates-admin-actions"><button type="submit">Guardar atualização</button><button id="updatesReset" type="button">Limpar</button><span id="updatesAdminStatus" aria-live="polite"></span></div>
        </form>
        <div id="updatesAdminList" class="updates-admin-list"></div>
      </section>
    </main>
    <footer class="site-footer"><p>© <span id="year"></span> Team Lambreta</p></footer>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
  <script src="supabase-client.js?v=102.0"></script>
  <script src="auth-manager.js?v=102.0"></script>
  <script src="presence-manager.js?v=103.0"></script>
  <script src="services/profile-service.js?v=102.5"></script>
  <script src="services/permission-service.js?v=102.3"></script>
  <script src="services/notification-service.js?v=102.0"></script>
  <script src="tl-shell-v115.js?v=115.0"></script>
  <script src="updates-v1.js?v=102.0"></script>
  <script>document.getElementById('year').textContent=new Date().getFullYear()</script>
</body>
</html>
