<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070d">
<title>Game Profile Preview — Team Lambreta</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#f5f7fa;background:#02070d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#0b1624 0,#02070d 50%,#010307 100%);min-height:100vh}.wrap{max-width:760px;margin:0 auto;padding:18px}.brand{text-align:center;font-weight:900;letter-spacing:.12em;color:#f4c35a;margin:8px 0 20px}.hint{opacity:.75;font-size:.9rem;margin:0 0 14px}.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}.game{position:relative;min-height:120px;border:1px solid rgba(255,255,255,.12);border-radius:20px;overflow:hidden;background:#0a111b;color:#fff;padding:0;cursor:pointer;text-align:left}.game:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.38))}.game span{position:absolute;left:14px;bottom:12px;z-index:2;font-weight:900;font-size:1.05rem}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);display:grid;place-items:center;padding:10px;z-index:30}.overlay[hidden]{display:none}.shell{position:relative;width:min(100%,720px);height:min(84vh,650px);min-height:500px;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.15);background:#07101a;box-shadow:0 24px 90px rgba(0,0,0,.6)}.cover{position:absolute;inset:0;background:linear-gradient(135deg,#142033,#06101a)}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,6,10,.08),rgba(2,6,10,.78) 70%,#03070c)}.head{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;padding:18px}.head small{display:block;opacity:.65;letter-spacing:.16em;font-size:.7rem}.head h2{margin:4px 0 0;font-size:clamp(1.5rem,6vw,2.2rem)}.close,.edit{border:0;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;padding:10px 12px;font:inherit}.stage{position:absolute;inset:84px 12px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.1);overflow:hidden;background:rgba(0,0,0,.16)}.avatar-wrap{position:absolute;left:50%;top:41%;transform:translate(-50%,-50%)}.char{width:min(68vw,420px);aspect-ratio:1/1;height:auto;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.78);background:rgba(255,255,255,.08);box-shadow:0 10px 40px rgba(0,0,0,.5)}.char img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;transform:scale(var(--zoom,1));transform-origin:center}.char .empty{width:100%;height:100%;display:grid;place-items:center;font-size:3rem;font-weight:900;opacity:.7}.nick{position:absolute;left:18px;bottom:18px;z-index:3;max-width:70%}.nick small{display:block;opacity:.65;letter-spacing:.12em;font-size:.72rem}.nick strong{display:block;margin-top:4px;font-size:clamp(1.2rem,5vw,1.8rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.edit{position:absolute;right:18px;bottom:18px;z-index:4}.panel{position:absolute;left:10px;right:10px;bottom:10px;z-index:8;background:rgba(4,8,14,.96);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:12px}.panel[hidden]{display:none}.panel label{display:block;font-size:.78rem;opacity:.75;margin-bottom:5px}.panel input[type=text]{width:100%;border:1px solid rgba(255,255,255,.14);background:#0a121e;color:#fff;border-radius:10px;padding:9px 10px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:10px}.row input[type=file]{max-width:100%;font-size:.78rem}.save{border:0;border-radius:10px;padding:10px 14px;background:#fff;color:#05080c;font-weight:900}.zoomline{display:grid;grid-template-columns:34px 1fr 34px;gap:10px;align-items:center;margin-top:14px}.zoomline button{border:0;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;height:36px;font-size:1.2rem}.zoomline input[type=range]{width:100%;accent-color:#fff}.feedback{margin-top:8px;font-size:.78rem;opacity:.7}.back{margin-top:18px;text-align:center;opacity:.7;font-size:.82rem}@media(max-width:560px){.wrap{padding:12px}.games{gap:10px}.game{min-height:105px}.shell{height:88vh;border-radius:22px 22px 0 0;align-self:end}.stage{inset:78px 10px 10px}.char{width:min(78vw,420px)}.avatar-wrap{top:40%}.overlay{align-items:end;padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">TEAM LAMBRETA · TESTE V123</div>
  <p class="hint">Teste sem login. Toca num jogo e envia uma imagem.</p>
  <div class="games">
    <button class="game" data-game="Fortnite"><span>FORTNITE</span></button>
    <button class="game" data-game="CS GO"><span>CS GO</span></button>
    <button class="game" data-game="Minecraft"><span>MINECRAFT</span></button>
    <button class="game" data-game="GTA V"><span>GTA V</span></button>
  </div>
  <div class="back">Nada aqui grava no perfil real. É só para acertarmos o visual.</div>
</div>
<section id="overlay" class="overlay" hidden>
  <div class="shell">
    <div class="cover"></div>
    <div class="head"><div><small>PERFIL DE JOGO</small><h2 id="title">Jogo</h2></div><button id="close" class="close">✕</button></div>
    <div class="stage">
      <div class="avatar-wrap"><div id="char" class="char"><div class="empty">TL</div></div></div>
      <div class="nick"><small>NICKNAME</small><strong id="nickView">Professor</strong></div>
      <button id="edit" class="edit">✎ Editar</button>
      <div id="panel" class="panel" hidden>
        <label>Nickname deste jogo</label><input id="nickInput" type="text" maxlength="32" value="Professor">
        <div class="row"><div><label>Foto / personagem</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></div><button id="save" class="save">Aplicar</button></div>
        <label style="margin-top:12px">Enquadramento da foto</label>
        <div class="zoomline"><button id="zoomOut" aria-label="Diminuir zoom">−</button><input id="zoomRange" type="range" min="70" max="220" value="100" step="1" aria-label="Zoom da foto"><button id="zoomIn" aria-label="Aumentar zoom">＋</button></div>
        <div id="feedback" class="feedback">Foto quadrada grande · zoom 100%</div>
      </div>
    </div>
  </div>
</section>
<script>
const overlay=document.getElementById('overlay'),char=document.getElementById('char'),panel=document.getElementById('panel'),feedback=document.getElementById('feedback'),range=document.getElementById('zoomRange');
function applyZoom(){const z=Number(range.value)/100;char.style.setProperty('--zoom',z.toFixed(2));feedback.textContent=`Foto quadrada · zoom ${range.value}%`;}
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{document.getElementById('title').textContent=b.dataset.game;overlay.hidden=false;document.documentElement.style.overflow='hidden';});
document.getElementById('close').onclick=()=>{overlay.hidden=true;panel.hidden=true;document.documentElement.style.overflow='';};
document.getElementById('edit').onclick=()=>panel.hidden=!panel.hidden;
document.getElementById('save').onclick=()=>{document.getElementById('nickView').textContent=document.getElementById('nickInput').value.trim()||'—';feedback.textContent='Aplicado no teste ✓';};
document.getElementById('file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;range.value=100;const url=URL.createObjectURL(f);char.innerHTML=`<img src="${url}" alt="">`;applyZoom();};
range.oninput=applyZoom;
document.getElementById('zoomOut').onclick=()=>{range.value=Math.max(70,Number(range.value)-5);applyZoom();};
document.getElementById('zoomIn').onclick=()=>{range.value=Math.min(220,Number(range.value)+5);applyZoom();};
applyZoom();
</script>
</body>
</html>
